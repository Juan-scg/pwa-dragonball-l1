<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA L1 — Dragon Ball</title>
  <meta name="theme-color" content="#0ea5e9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <header class="topbar">
    <h1>Dragon Ball — Catálogo</h1>
    <div class="actions">
      <input id="search" type="search" placeholder="Buscar por nombre (ej. goku)">
      <button id="installBtn" class="btn">Instalar</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Personajes</h2>
      <div id="status" class="status"></div>
      <div id="grid" class="grid"></div>
      <div class="pager">
        <button id="prev" class="btn" disabled>Anterior</button>
        <button id="next" class="btn">Siguiente</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>Datos de <a href="https://web.dragonball-api.com/" target="_blank" rel="noopener">Dragon Ball API</a>. Funciona sin conexión para los recursos estáticos.</small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
